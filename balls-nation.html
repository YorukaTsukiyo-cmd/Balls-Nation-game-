<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Balls Nation</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    touch-action: none;
  }
  body {
    background: radial-gradient(ellipse at 50% 0%, #6b5a44 0%, #3f3226 45%, #1c150e 100%);
    color: #f5e6c8;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  header.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px 2px;
    flex-shrink: 0;
  }
  h1.gameTitle {
    margin: 0;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 0.5px;
    color: #ffd23c;
    text-shadow: 0 2px 0 rgba(0,0,0,0.5);
  }
  .circleBtn {
    width: 38px; height: 38px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(6px);
    color: #f5e6c8;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 8px rgba(0,0,0,0.35);
    border: 1px solid rgba(255,210,60,0.2);
  }
  .circleBtn:active { transform: scale(0.9); background: rgba(255,255,255,0.24); }
  .topRight { display: flex; gap: 7px; }

  main {
    flex: 1;
    display: flex;
    gap: 8px;
    padding: 2px 10px;
    min-height: 0;
  }
  #boardWrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    min-height: 0;
    position: relative;
  }
  #board {
    border-radius: 16px;
    box-shadow: 0 0 0 3px rgba(255,210,60,0.3), 0 10px 30px rgba(0,0,0,0.5), inset 0 0 40px rgba(0,0,0,0.4);
    display: block;
    max-height: 100%;
    max-width: 100%;
    touch-action: none;
  }

  #sidebar {
    width: 82px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .panel {
    background: rgba(255,255,255,0.09);
    backdrop-filter: blur(6px);
    border-radius: 12px;
    padding: 7px;
    text-align: center;
    flex-shrink: 0;
    border: 1px solid rgba(255,210,60,0.15);
  }
  .panel .label {
    font-size: 9px;
    opacity: 0.75;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 3px;
    font-weight: 700;
  }
  .panel .value { font-size: 15px; font-weight: 800; }
  .panel.best { background: rgba(255,205,60,0.18); }
  .panel.best .value { color: #ffd23c; }

  footer { flex-shrink: 0; padding: 6px 14px 12px; }
  #controls {
    display: flex; align-items: center; justify-content: center;
    max-width: 480px; margin: 0 auto; gap: 16px;
  }
  #swapBtn {
    width: 50px; height: 50px; border-radius: 50%;
    border: 2px solid rgba(255,210,60,0.35);
    background: rgba(255,255,255,0.08);
    color: #f5e6c8; font-size: 20px; flex-shrink: 0;
  }
  #swapBtn:active { transform: scale(0.9); background: rgba(255,255,255,0.2); }

  #shooterPreview { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .ballDot { border-radius: 50%; box-shadow: inset -3px -4px 6px rgba(0,0,0,0.35), inset 2px 2px 4px rgba(255,255,255,0.5), 0 2px 5px rgba(0,0,0,0.35); }
  #currentBallDot { width: 42px; height: 42px; }
  #nextBallDot { width: 26px; height: 26px; opacity: 0.85; }
  #shooterArrow { font-size: 16px; opacity: 0.6; }

  #fireBtn {
    width: 68px; height: 68px; border-radius: 50%; border: none;
    background: radial-gradient(circle at 35% 30%, #ffe27a, #ffb020 60%, #d98600);
    color: #3a2000; font-weight: 900; font-size: 13px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.45); flex-shrink: 0;
  }
  #fireBtn:active { transform: scale(0.92); }

  #overlay {
    position: absolute; inset: 0;
    background: rgba(15,10,5,0.9);
    backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center; flex-direction: column;
    z-index: 50; text-align: center; padding: 20px; border-radius: 16px;
  }
  #overlay.show { display: flex; }
  #overlay h2 { font-size: 23px; margin: 0 0 6px; letter-spacing: 1px; color: #ffd23c; }
  #overlay p { opacity: 0.85; margin: 4px 0 10px; font-size: 13px; }
  #overlay .bigScore { font-size: 30px; font-weight: 800; margin-bottom: 4px; color: #ffd23c; }
  #overlay .bestRow { font-size: 12px; opacity: 0.8; margin-bottom: 16px; }
  #overlay button.mainBtn {
    background: linear-gradient(90deg, #b8860b, #8a5a00);
    border: none; color: #fff; padding: 13px 32px; border-radius: 14px;
    font-size: 15px; font-weight: 700; box-shadow: 0 6px 16px rgba(0,0,0,0.35);
  }
  #overlay button.mainBtn:active { transform: scale(0.96); }

  #levelToast {
    position: absolute; top: 10%; left: 50%; transform: translateX(-50%) scale(0.8);
    background: rgba(255,210,60,0.95); color: #3a2000; padding: 10px 22px; border-radius: 14px;
    font-weight: 900; font-size: 15px; opacity: 0; pointer-events: none;
    transition: opacity 0.25s, transform 0.25s; z-index: 40; box-shadow: 0 8px 20px rgba(0,0,0,0.4);
  }
  #levelToast.show { opacity: 1; transform: translateX(-50%) scale(1); }

  #settingsOverlay {
    position: fixed; inset: 0; background: rgba(10,7,4,0.65); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px;
  }
  #settingsOverlay.show { display: flex; }
  #settingsCard {
    background: linear-gradient(160deg, #6b5a44, #241d16);
    border-radius: 18px; padding: 18px; width: 100%; max-width: 320px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.45); border: 1px solid rgba(255,210,60,0.2);
  }
  #settingsCard h3 { margin: 0 0 14px; text-align: center; font-size: 18px; color: #ffd23c; }
  .settingRow { display: flex; justify-content: space-between; align-items: center; padding: 10px 4px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 14px; }
  .settingRow:last-of-type { border-bottom: none; }
  .switch { position: relative; width: 44px; height: 25px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switchTrack { position: absolute; inset: 0; background: rgba(255,255,255,0.2); border-radius: 20px; transition: 0.2s; }
  .switchTrack::before { content: ""; position: absolute; height: 19px; width: 19px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: 0.2s; }
  input:checked + .switchTrack { background: #d4a017; }
  input:checked + .switchTrack::before { transform: translateX(19px); }
  .levelSelect { display: flex; gap: 5px; flex-wrap: wrap; }
  .levelChip { width: 26px; height: 26px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.08); color: #fff; font-size: 12px; font-weight: 700; }
  .levelChip.active { background: #ffd23c; color: #3a2000; border-color: #ffd23c; }
  #resetBestBtn { margin-top: 12px; width: 100%; padding: 10px; border-radius: 10px; border: 1px solid rgba(255,90,90,0.4); background: rgba(255,90,90,0.15); color: #ff9a9a; font-size: 13px; font-weight: 600; }
  #resetBestBtn:active { background: rgba(255,90,90,0.3); }
  #closeSettingsBtn { margin-top: 10px; width: 100%; padding: 12px; border-radius: 10px; border: none; background: rgba(255,255,255,0.14); color: #fff; font-size: 14px; font-weight: 700; }
  #closeSettingsBtn:active { background: rgba(255,255,255,0.26); }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="circleBtn" id="pauseBtn">⏸</button>
    <h1 class="gameTitle">🗿 BALLS NATION</h1>
    <div class="topRight">
      <button class="circleBtn" id="soundBtn">🔊</button>
      <button class="circleBtn" id="settingsBtn">⚙️</button>
      <button class="circleBtn" id="restartBtn">↻</button>
    </div>
  </header>

  <main>
    <div id="boardWrap">
      <canvas id="board"></canvas>
      <div id="levelToast"></div>
      <div id="overlay">
        <h2 id="overlayTitle">BALLS NATION</h2>
        <p id="overlaySub">Boshlash uchun bosing</p>
        <div class="bigScore" id="overlayScore" style="display:none;"></div>
        <div class="bestRow" id="overlayBest" style="display:none;"></div>
        <button class="mainBtn" id="overlayBtn">BOSHLASH</button>
      </div>
    </div>

    <div id="sidebar">
      <div class="panel"><div class="label">Daraja</div><div class="value" id="levelVal">1</div></div>
      <div class="panel"><div class="label">Hisob</div><div class="value" id="scoreVal">0</div></div>
      <div class="panel"><div class="label">Toplar</div><div class="value" id="ballsVal">0</div></div>
      <div class="panel best"><div class="label">Rekord</div><div class="value" id="bestVal">0</div></div>
    </div>
  </main>

  <footer>
    <div id="controls">
      <button id="swapBtn">⇄</button>
      <div id="shooterPreview">
        <canvas id="currentBallDot" class="ballDot"></canvas>
        <span id="shooterArrow">→</span>
        <canvas id="nextBallDot" class="ballDot"></canvas>
      </div>
      <button id="fireBtn">OTISH</button>
    </div>
  </footer>
</div>

<div id="settingsOverlay">
  <div id="settingsCard">
    <h3>⚙️ Sozlamalar</h3>
    <div class="settingRow">
      <span>Ovoz effektlari</span>
      <label class="switch"><input type="checkbox" id="soundToggle" checked><span class="switchTrack"></span></label>
    </div>
    <div class="settingRow">
      <span>Vibratsiya</span>
      <label class="switch"><input type="checkbox" id="hapticToggle" checked><span class="switchTrack"></span></label>
    </div>
    <div class="settingRow" style="flex-direction:column; align-items:flex-start; gap:8px;">
      <span>Boshlang'ich daraja</span>
      <div class="levelSelect" id="levelSelect"></div>
    </div>
    <button id="resetBestBtn">Rekord natijani tozalash</button>
    <button id="closeSettingsBtn">Yopish</button>
  </div>
</div>

<script>
(function() {
  // ---------- Telegram WebApp ----------
  let tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) {
    tg.ready(); tg.expand();
    try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch(e) {}
    try { tg.setHeaderColor && tg.setHeaderColor('#3f3226'); tg.setBackgroundColor && tg.setBackgroundColor('#1c150e'); } catch(e) {}
  }

  function loadSetting(key, fallback) { try { const v = localStorage.getItem(key); return v===null?fallback:JSON.parse(v); } catch(e){ return fallback; } }
  function saveSetting(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {} }

  let soundOn = loadSetting('ballsnation_sound', true);
  let hapticOn = loadSetting('ballsnation_haptic', true);
  let startLevel = loadSetting('ballsnation_start_level', 1);
  let bestScore = loadSetting('ballsnation_best_score', 0);

  function haptic(type) {
    if (!hapticOn || !tg || !tg.HapticFeedback) return;
    try {
      if (type==='light') tg.HapticFeedback.impactOccurred('light');
      else if (type==='medium') tg.HapticFeedback.impactOccurred('medium');
      else if (type==='heavy') tg.HapticFeedback.impactOccurred('heavy');
      else if (type==='success') tg.HapticFeedback.notificationOccurred('success');
      else if (type==='error') tg.HapticFeedback.notificationOccurred('error');
    } catch(e) {}
  }

  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ audioCtx=null; } }
    if (audioCtx && audioCtx.state==='suspended') audioCtx.resume().catch(()=>{});
    return audioCtx;
  }
  function beep(freq, duration, type, vol, delay) {
    if (!soundOn) return;
    const ctx = ensureAudio(); if (!ctx) return;
    const t0 = ctx.currentTime + (delay||0);
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.type = type||'sine';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(vol||0.12, t0+0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+duration);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t0); osc.stop(t0+duration+0.02);
  }
  const sfx = {
    shoot: () => beep(520, 0.06, 'triangle', 0.08),
    hit:   () => beep(300, 0.05, 'square', 0.06),
    pop: (n) => { for (let i=0;i<Math.min(n,6);i++) beep(500+i*90, 0.09, 'sine', 0.09, i*0.03); },
    combo: (lvl) => { const base=600+lvl*90; [0,1,2].forEach((i)=>beep(base+i*130,0.1,'triangle',0.1,i*0.05)); },
    levelup: () => [392,523,659,784].forEach((f,i)=>beep(f,0.13,'triangle',0.09,i*0.07)),
    gameover: () => [392,349,294,220].forEach((f,i)=>beep(f,0.22,'sawtooth',0.09,i*0.16)),
    newbest: () => [523,659,784,1047,1319].forEach((f,i)=>beep(f,0.13,'triangle',0.1,i*0.07)),
    start: () => [330,415,494,587].forEach((f,i)=>beep(f,0.09,'triangle',0.08,i*0.05)),
    swap: () => beep(700,0.05,'square',0.06)
  };

  const PALETTE = ['#ff4757','#3f6fff','#2ed573','#ffd32a','#a55eea','#ff793f','#ff6fa5'];
  function colorCountForLevel(lvl) { return Math.min(4 + Math.floor((lvl-1)/2), PALETTE.length); }

  const boardCanvas = document.getElementById('board');
  const bctx = boardCanvas.getContext('2d');
  const curDot = document.getElementById('currentBallDot');
  const curCtx = curDot.getContext('2d');
  const nextDot = document.getElementById('nextBallDot');
  const nextCtx = nextDot.getContext('2d');

  let W = 360, H = 640;
  let path = null;
  let ballR = 14, ballD = 28;
  let shooterX = 180, shooterY = 320;

  // ---------- Spiral yo'l (markazdan tashqariga: t=0 teshik, t=1 chekka) ----------
  function buildPath(w,h,ballDiam) {
    const cx = w/2, cy = h/2;
    const maxR = Math.min(w,h)*0.47;
    const minR = Math.max(ballDiam*1.15, Math.min(w,h)*0.045);
    const totalAngle = Math.PI*2*2.8;
    const steps = 520;
    const pts = [];
    for (let i=0;i<=steps;i++) {
      const t = i/steps;
      const angle = t*totalAngle - Math.PI/2;
      const r = minR + (maxR-minR)*t;
      pts.push({ x: cx + r*Math.cos(angle), y: cy + r*Math.sin(angle) });
    }
    const cum = [0];
    for (let i=1;i<pts.length;i++) { const dx=pts[i].x-pts[i-1].x, dy=pts[i].y-pts[i-1].y; cum.push(cum[i-1]+Math.sqrt(dx*dx+dy*dy)); }
    return { points: pts, cum, total: cum[cum.length-1] };
  }
  function pointAtS(s) {
    if (!path) return {x:0,y:0};
    s = Math.max(0, Math.min(path.total, s));
    const cum = path.cum, pts = path.points;
    let lo=0, hi=cum.length-1;
    while (lo<hi) { const mid=(lo+hi)>>1; if (cum[mid]<s) lo=mid+1; else hi=mid; }
    const i = Math.max(1, lo);
    const s0=cum[i-1], s1=cum[i];
    const t = s1>s0 ? (s-s0)/(s1-s0) : 0;
    const p0=pts[i-1], p1=pts[i];
    return { x: p0.x+(p1.x-p0.x)*t, y: p0.y+(p1.y-p0.y)*t };
  }
  function nearestSOnPath(x,y) {
    let best=0, bestD=Infinity;
    for (let i=0;i<path.points.length;i++) {
      const p = path.points[i];
      const dx=p.x-x, dy=p.y-y, d=dx*dx+dy*dy;
      if (d<bestD) { bestD=d; best=path.cum[i]; }
    }
    return best;
  }

  function resizeCanvas() {
    const wrap = document.getElementById('boardWrap');
    const maxW = wrap.clientWidth - 4;
    const maxH = wrap.clientHeight - 4;
    let w = maxW, h = maxH;
    const targetRatio = 0.86;
    if (w/h > targetRatio) w = h*targetRatio; else h = w/targetRatio;
    W = Math.floor(w); H = Math.floor(h);
    boardCanvas.width = W; boardCanvas.height = H;

    ballR = Math.max(9, Math.min(W,H)/24);
    ballD = ballR*2;

    const oldTotal = path ? path.total : 0;
    const oldHeadFrac = (path && oldTotal>0) ? headS/oldTotal : 0.85;
    path = buildPath(W, H, ballD);
    shooterX = W/2; shooterY = H/2;
    if (started) headS = oldHeadFrac * path.total;

    const dpr = window.devicePixelRatio || 1;
    [curDot, nextDot].forEach(c => { const size = c.clientWidth || 40; c.width = size*dpr; c.height = size*dpr; });
    drawPreviews();
    draw();
  }

  let chain = [];
  let headS = 0;
  let currentColor = null, nextColor = null;
  let shotBall = null;
  let score = 0, level = 1, ballsCleared = 0;
  let gameOver = false, paused = false, started = false;
  let aimAngle = -Math.PI/2;
  let particles = [];
  let levelTransition = false, levelTransitionTimer = 0;
  let lastTime = 0, animId = null;

  function randColor() { const n = colorCountForLevel(level); return PALETTE[Math.floor(Math.random()*n)]; }

  function buildChain(lvl) {
    const fillFrac = Math.min(0.55 + lvl*0.05, 0.85);
    let count = Math.max(10, Math.floor((path.total*fillFrac)/ballD));
    count = Math.min(count, 90);
    chain = [];
    let prev=null, prevPrev=null;
    for (let i=0;i<count;i++) {
      let c, tries=0;
      do { c = randColor(); tries++; } while (tries<8 && c===prev && c===prevPrev);
      chain.push({ color: c, offset: 0 });
      prevPrev = prev; prev = c;
    }
    headS = Math.max(path.total*0.6, path.total - ballD*2);
  }

  function targetS(index) { return headS + index*ballD; }
  function displayS(index) { const b = chain[index]; return Math.max(0, Math.min(path.total, targetS(index) + (b.offset||0))); }

  function spawnParticles(x,y,color,count) {
    for (let i=0;i<count;i++) {
      const a = Math.random()*Math.PI*2, sp = 40+Math.random()*90;
      particles.push({ x,y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, color, life: 1, r: 2+Math.random()*3 });
    }
  }

  function removeGroup(left, right, comboLevel) {
    const removedCount = right-left+1;
    for (let i=left;i<=right;i++) { const p = pointAtS(displayS(i)); spawnParticles(p.x, p.y, chain[i].color, 6); }
    for (let i=right+1;i<chain.length;i++) chain[i].offset = (chain[i].offset||0) + removedCount*ballD;
    const base = 30 + (removedCount-3)*20;
    score += Math.round(base * level * comboLevel);
    ballsCleared += removedCount;
    updateHud();
    chain.splice(left, removedCount);
    if (comboLevel>1) { haptic('heavy'); sfx.combo(comboLevel); } else { haptic('medium'); sfx.pop(removedCount); }
  }

  function resolveMatches(index, comboLevel) {
    if (chain.length===0) return;
    index = Math.max(0, Math.min(index, chain.length-1));
    const color = chain[index].color;
    let left=index, right=index;
    while (left>0 && chain[left-1].color===color) left--;
    while (right<chain.length-1 && chain[right+1].color===color) right++;
    const runLen = right-left+1;
    if (runLen>=3) {
      removeGroup(left,right,comboLevel);
      if (chain.length>0) {
        if (left>0 && left<chain.length && chain[left-1] && chain[left] && chain[left-1].color===chain[left].color) {
          resolveMatches(left, comboLevel+1);
        }
      }
      if (chain.length===0 && !levelTransition) triggerLevelClear();
    }
  }

  function triggerLevelClear() {
    levelTransition = true; levelTransitionTimer = 1300;
    score += 200*level; updateHud();
    sfx.levelup(); haptic('success');
    showLevelToast('DARAJA ' + level + ' TUGADI! +' + (200*level));
  }
  function showLevelToast(text) {
    const el = document.getElementById('levelToast');
    el.textContent = text; el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 1200);
  }

  function insertShotBall() {
    const sb = shotBall;
    const sShot = nearestSOnPath(sb.x, sb.y);
    if (chain.length===0) {
      chain.push({ color: sb.color, offset: 0 });
      headS = Math.min(sShot, path.total);
      shotBall = null;
      resolveMatches(0,1);
      return;
    }
    let nearestIdx=0, bestD=Infinity;
    for (let i=0;i<chain.length;i++) {
      const p = pointAtS(displayS(i));
      const dx=p.x-sb.x, dy=p.y-sb.y, d=dx*dx+dy*dy;
      if (d<bestD) { bestD=d; nearestIdx=i; }
    }
    const neighborS = targetS(nearestIdx);
    let insertIdx = sShot < neighborS ? nearestIdx : nearestIdx+1;
    insertIdx = Math.max(0, Math.min(insertIdx, chain.length));
    for (let i=insertIdx;i<chain.length;i++) chain[i].offset = (chain[i].offset||0) - ballD;
    chain.splice(insertIdx, 0, { color: sb.color, offset: ballD });
    shotBall = null;
    sfx.hit();
    resolveMatches(insertIdx, 1);
  }

  function updateHud() {
    document.getElementById('scoreVal').textContent = score;
    document.getElementById('levelVal').textContent = level;
    document.getElementById('ballsVal').textContent = ballsCleared;
    document.getElementById('bestVal').textContent = bestScore;
  }

  function hexToRgb(hex) { const v = parseInt(hex.slice(1),16); return { r:(v>>16)&255, g:(v>>8)&255, b:v&255 }; }
  function lighten(hex, amt) { const {r,g,b} = hexToRgb(hex); return `rgb(${Math.min(255,r+255*amt)|0},${Math.min(255,g+255*amt)|0},${Math.min(255,b+255*amt)|0})`; }
  function darken(hex, amt) { const {r,g,b} = hexToRgb(hex); return `rgb(${(r*(1-amt))|0},${(g*(1-amt))|0},${(b*(1-amt))|0})`; }

  function drawBallGlyph(ctx, size, color) {
    ctx.clearRect(0,0,ctx.canvas.width,ctx.canvas.height);
    const r = (ctx.canvas.width)/2 - 2;
    const cx = ctx.canvas.width/2, cy = ctx.canvas.height/2;
    const grad = ctx.createRadialGradient(cx-r*0.35,cy-r*0.4,r*0.15,cx,cy,r);
    grad.addColorStop(0, lighten(color,0.5)); grad.addColorStop(0.6, color); grad.addColorStop(1, darken(color,0.35));
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle=grad; ctx.fill();
    ctx.beginPath(); ctx.arc(cx-r*0.3,cy-r*0.35,r*0.28,0,Math.PI*2); ctx.fillStyle='rgba(255,255,255,0.55)'; ctx.fill();
  }
  function drawPreviews() { if (currentColor) drawBallGlyph(curCtx, curDot.width, currentColor); if (nextColor) drawBallGlyph(nextCtx, nextDot.width, nextColor); }

  function drawTotemFace(x,y,s) {
    bctx.save();
    bctx.translate(x,y);
    bctx.fillStyle = 'rgba(120,105,80,0.55)';
    bctx.strokeStyle = 'rgba(40,30,15,0.6)';
    bctx.lineWidth = s*0.05;
    bctx.beginPath(); bctx.roundRect ? bctx.roundRect(-s/2,-s/2,s,s,s*0.15) : bctx.rect(-s/2,-s/2,s,s);
    bctx.fill(); bctx.stroke();
    bctx.fillStyle = 'rgba(20,14,8,0.55)';
    bctx.beginPath(); bctx.arc(-s*0.18,-s*0.05,s*0.09,0,Math.PI*2); bctx.fill();
    bctx.beginPath(); bctx.arc(s*0.18,-s*0.05,s*0.09,0,Math.PI*2); bctx.fill();
    bctx.beginPath(); bctx.rect(-s*0.18,s*0.16,s*0.36,s*0.09); bctx.fill();
    bctx.restore();
  }

  function drawArenaBackground() {
    const g = bctx.createRadialGradient(W/2,H/2,10,W/2,H/2,Math.max(W,H)*0.75);
    g.addColorStop(0, '#8f8065'); g.addColorStop(0.55, '#5c4d38'); g.addColorStop(1, '#2a2013');
    bctx.fillStyle = g; bctx.fillRect(0,0,W,H);
    // stone border frame
    bctx.strokeStyle = 'rgba(30,22,12,0.5)';
    bctx.lineWidth = Math.min(W,H)*0.05;
    bctx.strokeRect(bctx.lineWidth/2, bctx.lineWidth/2, W-bctx.lineWidth, H-bctx.lineWidth);
    bctx.strokeStyle = 'rgba(255,210,60,0.18)';
    bctx.lineWidth = 2;
    bctx.strokeRect(6,6,W-12,H-12);
    const ts = Math.min(W,H)*0.11;
    drawTotemFace(ts*0.7, ts*0.7, ts);
    drawTotemFace(W-ts*0.7, ts*0.7, ts);
    drawTotemFace(ts*0.7, H-ts*0.7, ts);
    drawTotemFace(W-ts*0.7, H-ts*0.7, ts);
  }

  function drawPathVisual() {
    if (!path) return;
    bctx.strokeStyle = 'rgba(20,15,8,0.55)';
    bctx.lineWidth = ballD*1.3;
    bctx.lineCap = 'round'; bctx.lineJoin = 'round';
    bctx.beginPath();
    path.points.forEach((p,i) => { if (i===0) bctx.moveTo(p.x,p.y); else bctx.lineTo(p.x,p.y); });
    bctx.stroke();
    bctx.strokeStyle = 'rgba(230,215,180,0.16)';
    bctx.lineWidth = ballD*0.95;
    bctx.beginPath();
    path.points.forEach((p,i) => { if (i===0) bctx.moveTo(p.x,p.y); else bctx.lineTo(p.x,p.y); });
    bctx.stroke();
    // hole (path start, t=0)
    const hole = path.points[0];
    const holeR = ballD*0.7;
    const g = bctx.createRadialGradient(hole.x,hole.y,1,hole.x,hole.y,holeR);
    g.addColorStop(0,'#000'); g.addColorStop(1,'#4a0f0f');
    bctx.beginPath(); bctx.arc(hole.x,hole.y,holeR,0,Math.PI*2); bctx.fillStyle=g; bctx.fill();
    bctx.strokeStyle='rgba(255,90,90,0.6)'; bctx.lineWidth=2; bctx.stroke();
  }

  function drawChainBall(x,y,color) {
    const r = ballR;
    const grad = bctx.createRadialGradient(x-r*0.3,y-r*0.35,r*0.1,x,y,r);
    grad.addColorStop(0, lighten(color,0.45)); grad.addColorStop(0.65, color); grad.addColorStop(1, darken(color,0.35));
    bctx.beginPath(); bctx.arc(x,y,r,0,Math.PI*2); bctx.fillStyle=grad; bctx.fill();
    bctx.beginPath(); bctx.arc(x-r*0.28,y-r*0.32,r*0.24,0,Math.PI*2); bctx.fillStyle='rgba(255,255,255,0.5)'; bctx.fill();
  }

  function drawShooter() {
    bctx.save();
    bctx.translate(shooterX, shooterY);
    const baseR = ballR*1.9;
    const bg = bctx.createRadialGradient(-baseR*0.3,-baseR*0.3,2,0,0,baseR);
    bg.addColorStop(0,'#d9c48a'); bg.addColorStop(0.6,'#8a6f3f'); bg.addColorStop(1,'#4a3a1f');
    bctx.beginPath(); bctx.arc(0,0,baseR,0,Math.PI*2); bctx.fillStyle=bg; bctx.fill();
    bctx.strokeStyle='rgba(255,210,60,0.7)'; bctx.lineWidth=2.5; bctx.stroke();
    bctx.beginPath(); bctx.arc(0,0,baseR*0.62,0,Math.PI*2); bctx.strokeStyle='rgba(40,25,10,0.5)'; bctx.lineWidth=1.5; bctx.stroke();

    if (!gameOver && !paused && started && !shotBall) {
      bctx.save();
      bctx.setLineDash([6,7]);
      bctx.strokeStyle = 'rgba(120,220,255,0.35)';
      bctx.lineWidth = 2;
      bctx.beginPath();
      bctx.moveTo(0,0);
      bctx.lineTo(Math.cos(aimAngle)*Math.max(W,H), Math.sin(aimAngle)*Math.max(W,H));
      bctx.stroke();
      bctx.restore();
    }

    bctx.rotate(aimAngle);
    bctx.fillStyle = '#2f6b4a';
    bctx.beginPath();
    bctx.moveTo(baseR*0.55, -ballR*0.55);
    bctx.lineTo(baseR*1.55, 0);
    bctx.lineTo(baseR*0.55, ballR*0.55);
    bctx.closePath(); bctx.fill();
    bctx.fillStyle = '#ffd23c';
    bctx.beginPath(); bctx.arc(baseR*1.25,-ballR*0.15,ballR*0.13,0,Math.PI*2); bctx.fill();
    bctx.restore();

    if (currentColor) drawChainBall(shooterX + Math.cos(aimAngle)*baseR*1.7, shooterY + Math.sin(aimAngle)*baseR*1.7, currentColor);
  }

  function draw() {
    if (!path) return;
    bctx.clearRect(0,0,W,H);
    drawArenaBackground();
    drawPathVisual();
    for (let i=chain.length-1;i>=0;i--) { const p = pointAtS(displayS(i)); drawChainBall(p.x,p.y,chain[i].color); }
    if (shotBall) drawChainBall(shotBall.x, shotBall.y, shotBall.color);
    particles.forEach(pt => {
      bctx.globalAlpha = Math.max(0, pt.life);
      bctx.beginPath(); bctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2); bctx.fillStyle = pt.color; bctx.fill();
      bctx.globalAlpha = 1;
    });
    drawShooter();
  }

  function setAimFromPoint(x,y) {
    const dx = x - shooterX, dy = y - shooterY;
    if (Math.abs(dx)<1 && Math.abs(dy)<1) return;
    aimAngle = Math.atan2(dy,dx);
  }
  function fireShot() {
    if (gameOver||paused||!started||shotBall||levelTransition||!currentColor) return;
    const speed = Math.max(W,H)*1.7;
    const startDist = ballR*1.9*1.7;
    shotBall = {
      x: shooterX + Math.cos(aimAngle)*startDist,
      y: shooterY + Math.sin(aimAngle)*startDist,
      vx: Math.cos(aimAngle)*speed, vy: Math.sin(aimAngle)*speed,
      color: currentColor, bounces: 0, life: 3
    };
    currentColor = nextColor; nextColor = randColor();
    drawPreviews(); haptic('light'); sfx.shoot();
  }
  function doSwap() {
    if (gameOver||paused||!started) return;
    const tmp = currentColor; currentColor = nextColor; nextColor = tmp;
    drawPreviews(); haptic('light'); sfx.swap();
  }

  function step(dt) {
    if (levelTransition) {
      levelTransitionTimer -= dt*1000;
      if (levelTransitionTimer<=0) { levelTransition=false; level+=1; buildChain(level); updateHud(); }
      return;
    }
    const chainSpeed = (Math.min(W,H)*0.0825) * (1 + (level-1)*0.16);
    headS -= chainSpeed*dt;
    for (const b of chain) {
      if (b.offset) {
        const decay = ballD*7*dt;
        if (b.offset>0) b.offset = Math.max(0, b.offset-decay); else b.offset = Math.min(0, b.offset+decay);
      }
    }
    if (chain.length>0 && headS<=0) { endGame(); return; }

    if (shotBall) {
      shotBall.x += shotBall.vx*dt; shotBall.y += shotBall.vy*dt; shotBall.life -= dt;
      if (shotBall.x < ballR) { shotBall.x=ballR; shotBall.vx*=-1; shotBall.bounces++; }
      if (shotBall.x > W-ballR) { shotBall.x=W-ballR; shotBall.vx*=-1; shotBall.bounces++; }
      if (shotBall.y < ballR) { shotBall.y=ballR; shotBall.vy*=-1; shotBall.bounces++; }
      if (shotBall.y > H-ballR) { shotBall.y=H-ballR; shotBall.vy*=-1; shotBall.bounces++; }
      if (shotBall && (shotBall.life<=0 || shotBall.bounces>6)) { shotBall = null; }
      else if (shotBall) {
        for (let i=0;i<chain.length;i++) {
          const p = pointAtS(displayS(i));
          const dx=p.x-shotBall.x, dy=p.y-shotBall.y;
          if (dx*dx+dy*dy < (ballR*1.85)*(ballR*1.85)) { insertShotBall(); break; }
        }
      }
    }
    particles.forEach(pt => { pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; pt.vy+=200*dt; pt.life-=dt*1.6; });
    particles = particles.filter(p => p.life>0);
  }

  function gameLoop(time) {
    if (!lastTime) lastTime = time;
    let dt = (time-lastTime)/1000; dt = Math.min(dt, 0.033); lastTime = time;
    if (!paused && !gameOver && started) step(dt);
    draw();
    animId = requestAnimationFrame(gameLoop);
  }

  function endGame() {
    gameOver = true; started = false;
    haptic('error'); sfx.gameover();
    let isNewBest = false;
    if (score>bestScore) { bestScore=score; saveSetting('ballsnation_best_score', bestScore); isNewBest=true; }
    updateHud();
    const bestEl = document.getElementById('overlayBest');
    bestEl.style.display='block';
    bestEl.textContent = isNewBest ? '🏆 Yangi rekord!' : ('Rekord: ' + bestScore);
    if (isNewBest) setTimeout(() => sfx.newbest(), 250);
    showOverlay("O'YIN TUGADI", 'Sizning natijangiz:', score, 'QAYTA BOSHLASH');
  }
  function showOverlay(title, sub, scoreVal, btnText) {
    document.getElementById('overlayTitle').textContent = title;
    document.getElementById('overlaySub').textContent = sub;
    const scoreEl = document.getElementById('overlayScore');
    if (scoreVal!==undefined && scoreVal!==null) { scoreEl.style.display='block'; scoreEl.textContent=scoreVal; }
    else { scoreEl.style.display='none'; document.getElementById('overlayBest').style.display='none'; }
    document.getElementById('overlayBtn').textContent = btnText;
    document.getElementById('overlay').classList.add('show');
  }
  function hideOverlay() { document.getElementById('overlay').classList.remove('show'); }

  function resetGame() {
    level = startLevel; score = 0; ballsCleared = 0; gameOver = false;
    particles = []; shotBall = null; levelTransition = false;
    currentColor = randColor(); nextColor = randColor();
    buildChain(level);
    drawPreviews(); updateHud(); draw();
  }
  function startGame() { ensureAudio(); resetGame(); started = true; hideOverlay(); haptic('success'); sfx.start(); }
  function togglePause() {
    if (!started || gameOver) return;
    paused = !paused;
    document.getElementById('pauseBtn').textContent = paused ? '▶' : '⏸';
    if (paused) showOverlay('PAUZA', 'Davom etish uchun bosing', null, 'DAVOM ETTIRISH'); else hideOverlay();
  }
  function restartGame() { startGame(); }

  boardCanvas.addEventListener('pointerdown', (e) => {
    const rect = boardCanvas.getBoundingClientRect();
    setAimFromPoint((e.clientX-rect.left)*(W/rect.width), (e.clientY-rect.top)*(H/rect.height));
    draw();
  });
  boardCanvas.addEventListener('pointermove', (e) => {
    const rect = boardCanvas.getBoundingClientRect();
    setAimFromPoint((e.clientX-rect.left)*(W/rect.width), (e.clientY-rect.top)*(H/rect.height));
    draw();
  });
  boardCanvas.addEventListener('pointerup', () => { fireShot(); });

  document.getElementById('fireBtn').addEventListener('click', fireShot);
  document.getElementById('swapBtn').addEventListener('click', doSwap);
  document.getElementById('pauseBtn').addEventListener('click', togglePause);
  document.getElementById('restartBtn').addEventListener('click', restartGame);
  document.getElementById('overlayBtn').addEventListener('click', () => { if (paused) { togglePause(); return; } startGame(); });

  document.getElementById('soundBtn').addEventListener('click', function() {
    soundOn = !soundOn; saveSetting('ballsnation_sound', soundOn);
    this.textContent = soundOn ? '🔊' : '🔇';
    document.getElementById('soundToggle').checked = soundOn;
    if (soundOn) { ensureAudio(); beep(440,0.06,'sine',0.06); }
  });

  const settingsOverlay = document.getElementById('settingsOverlay');
  document.getElementById('settingsBtn').addEventListener('click', () => settingsOverlay.classList.add('show'));
  document.getElementById('closeSettingsBtn').addEventListener('click', () => settingsOverlay.classList.remove('show'));
  settingsOverlay.addEventListener('click', (e) => { if (e.target===settingsOverlay) settingsOverlay.classList.remove('show'); });

  const soundToggle = document.getElementById('soundToggle');
  soundToggle.checked = soundOn;
  soundToggle.addEventListener('change', () => {
    soundOn = soundToggle.checked; saveSetting('ballsnation_sound', soundOn);
    document.getElementById('soundBtn').textContent = soundOn ? '🔊' : '🔇';
    if (soundOn) { ensureAudio(); beep(440,0.06,'sine',0.06); }
  });
  const hapticToggle = document.getElementById('hapticToggle');
  hapticToggle.checked = hapticOn;
  hapticToggle.addEventListener('change', () => {
    hapticOn = hapticToggle.checked; saveSetting('ballsnation_haptic', hapticOn);
    if (hapticOn) haptic('light');
  });
  const levelSelectEl = document.getElementById('levelSelect');
  for (let i=1;i<=9;i++) {
    const chip = document.createElement('button');
    chip.className = 'levelChip' + (i===startLevel ? ' active' : '');
    chip.textContent = i;
    chip.addEventListener('click', () => {
      startLevel = i; saveSetting('ballsnation_start_level', startLevel);
      Array.from(levelSelectEl.children).forEach(c=>c.classList.remove('active'));
      chip.classList.add('active'); haptic('light');
    });
    levelSelectEl.appendChild(chip);
  }
  document.getElementById('resetBestBtn').addEventListener('click', () => {
    bestScore = 0; saveSetting('ballsnation_best_score', 0); updateHud(); haptic('medium');
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === ' ') { e.preventDefault(); fireShot(); }
    else if (e.key === 'x' || e.key === 'X') doSwap();
    else if (e.key === 'p' || e.key === 'P') togglePause();
  });

  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));

  resizeCanvas();
  currentColor = randColor(); nextColor = randColor();
  chain = [];
  drawPreviews();
  document.getElementById('soundBtn').textContent = soundOn ? '🔊' : '🔇';
  updateHud();
  showOverlay('BALLS NATION', 'Rangli toplarni ustma-ust otib, 3 tadan yigib yoq qiling', null, 'BOSHLASH');
  animId = requestAnimationFrame(gameLoop);

  if (tg && tg.BackButton) { try { tg.BackButton.onClick(() => tg.close()); } catch(e) {} }
})();
</script>
</body>
</html>
